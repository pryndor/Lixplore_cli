[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lixplore-cli"
version = "1.2.1"
description = "Academic Literature Search & Export CLI Tool"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Balasubramanian Periannan", email = "balathepharmacist@gmail.com"}
]
maintainers = [
    {name = "Balasubramanian Periannan", email = "balathepharmacist@gmail.com"}
]
keywords = [
    "literature",
    "search",
    "academic",
    "pubmed",
    "arxiv",
    "crossref",
    "research",
    "papers",
    "export",
    "bibliography",
    "scientific",
    "citations"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Text Processing :: General",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Console",
]
dependencies = [
    "biopython>=1.79",
    "requests>=2.25.0",
    "openpyxl>=3.0.0",
]

[project.optional-dependencies]
tui = [
    "rich>=13.0.0",
    "textual>=4.0.0; python_version >= '3.9'",
]
all = [
    "rich>=13.0.0",
    "textual>=4.0.0; python_version >= '3.9'",
]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/pryndor/Lixplore_cli"
Documentation = "https://pryndor.github.io/Lixplore_cli/"
Repository = "https://github.com/pryndor/Lixplore_cli"
"Bug Tracker" = "https://github.com/pryndor/Lixplore_cli/issues"

[project.scripts]
lixplore = "lixplore.cli:main"
lixplore-alerts = "lixplore.alerts.runner:main"

[tool.setuptools]
packages = ["lixplore", "lixplore.sources", "lixplore.utils", "lixplore.alerts", "lixplore.tui", "lixplore.templates"]

[tool.setuptools.package-data]
lixplore = ["py.typed"]
"lixplore.alerts" = ["env.example"]
"lixplore.templates" = ["*.json"]

[tool.setuptools.data-files]
"share/man/man1" = ["docs/lixplore.1"]
