name: Publish to PyPI

# Uses PyPI Trusted Publishing (OIDC): no API token is stored in the repo.
# One-time setup on pypi.org → lixplore-cli → Settings → Publishing:
#   owner pryndor, repository Lixplore_cli, workflow publish.yml, environment pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Check tag matches package version
      if: github.event_name == 'release'
      run: |
        version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
          exit 1
        fi

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check --strict dist/*

    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lixplore-cli/
    permissions:
      id-token: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        # Versions uploaded by hand (e.g. 1.2.0) are skipped instead of failing
        skip-existing: true
